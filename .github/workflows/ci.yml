name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high
        continue-on-error: true
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @aaf/command-center build
        env:
          AAF_DATA_DIR: ":memory:"
      - run: pnpm --filter @aaf/command-center exec playwright install --with-deps chromium
      - run: pnpm --filter @aaf/command-center e2e
