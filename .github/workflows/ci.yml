name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @aaf/command-center build
      - run: pnpm --filter @aaf/command-center exec playwright install --with-deps chromium
      - run: pnpm --filter @aaf/command-center e2e

  # The same security-critical suites, but against a REAL PostgreSQL server reached as the least-privileged login role.
  # (Locally this runs against `pnpm localpg start`; here a service container plays that part.)
  real-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AAF_TEST_BACKEND: realpg
      AAF_REALPG_ADMIN_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @aaf/database test
      - run: pnpm --filter @aaf/jobs test
      - run: pnpm --filter @aaf/brain test
      - run: pnpm --filter @aaf/command-center build
      - run: pnpm --filter @aaf/command-center exec playwright install --with-deps chromium
      - run: pnpm --filter @aaf/command-center e2e:realpg
